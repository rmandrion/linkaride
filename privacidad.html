<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LinkaRide</title>
  <style>
    :root { --ink: #142b49; --sky: #1a6fbf; --paper: #f5faff; --slate: #4d6074; --mark: #fff3c4; }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font: 18px/1.55 Georgia, "Iowan Old Style", Palatino, serif;
    }
    main { width: min(42rem, calc(100% - 2rem)); margin: 4rem auto; }
    h1 { margin: 0.3rem 0; font-family: "Avenir Next", "Segoe UI", sans-serif; font-size: 2.6rem; line-height: 1; }
    .brand { margin: 0; font-family: "Avenir Next", "Segoe UI", sans-serif; letter-spacing: 0.08em; text-transform: uppercase; color: var(--sky); font-size: 0.85rem; }
    a { color: var(--sky); }
    .todo { background: var(--mark); }
  </style>
</head>
<body>
  <main>
    <p class="brand">LinkaRide</p>
    <h1>Navegación en grupo para motos.</h1>
    <p>Group navigation for motorcycles.</p>
    <p><a href="privacidad.html">Política de privacidad</a> · <a href="privacidad.html#en">Privacy policy</a></p>
    <p>Contacto: <span class="todo">email@dominio</span></p>
  </main>
</body>
</html>
